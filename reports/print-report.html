<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الأداء | جمعية فرقان لتحفيظ القرآن الكريم</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  body { background: #fff; }
  .report-doc { max-width: 900px; margin: 0 auto; padding: 30px; background: #fff; }
  .report-header { display:flex; align-items:center; justify-content:space-between; border-bottom:4px solid var(--gold-500); padding-bottom:18px; margin-bottom:24px; }
  .report-header .logo-box { width:70px; height:70px; border-radius:50%; background:#fff; border:2px solid var(--gold-400); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:5px; }
  .report-header .logo-box img { width:100%; height:100%; object-fit:contain; }
  .report-header .titles { text-align:left; }
  .report-header h1 { color:var(--maroon-900); font-size:1.3rem; margin:0; }
  .report-header p { color:var(--text-muted); font-size:.85rem; margin:0; }

  .meta-table { width:100%; border-collapse:collapse; margin-bottom:22px; font-size:.88rem; }
  .meta-table td { padding:8px 10px; border:1px solid var(--border); }
  .meta-table td.label { background:var(--gold-100); font-weight:700; width:160px; }

  .section-title { color:var(--maroon-900); font-size:1.05rem; font-weight:800; border-right:5px solid var(--gold-500); padding-right:10px; margin:26px 0 12px; }

  table.data-table { width:100%; border-collapse:collapse; font-size:.82rem; margin-bottom:14px; }
  table.data-table th { background:var(--maroon-900); color:#fff; padding:8px; text-align:right; }
  table.data-table td { padding:8px; border:1px solid var(--border); }
  table.data-table tr:nth-child(even) { background:#faf7f2; }

  .status-tag { font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; }
  .status-tag.done { background:#e8f6ee; color:var(--status-done); }
  .status-tag.near { background:#fbf1dd; color:var(--status-near); }
  .status-tag.warn { background:#fdece0; color:var(--status-warn); }
  .status-tag.fail { background:#fdecea; color:var(--status-fail); }
  .status-tag.none { background:#f1f1f2; color:var(--status-none); }

  .item-card { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fffdf8; }
  .item-card .item-row { display:flex; font-size:.85rem; margin-bottom:4px; }
  .item-card .item-row .k { font-weight:700; color:var(--maroon-900); min-width:170px; }
  .item-card .item-row .v { color:#2b2321; }
  .empty-note { color: var(--text-muted); font-size:.85rem; }

  .toolbar { position:sticky; top:0; background:#fff; padding:14px 0; border-bottom:1px solid var(--border); margin-bottom:20px; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px; z-index:10; }
  .issued-note { background:#e8f6ee; border:1px solid #bfe4cd; color:var(--status-done); border-radius:10px; padding:12px 16px; margin-bottom:18px; font-size:.9rem; }

  @media print {
    .toolbar, #topbar-mount { display: none !important; }
    .report-doc { padding: 0; max-width: 100%; }
    .section-title { break-after: avoid; }
    table.data-table { break-inside: avoid; }
  }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="toolbar page-wrap" style="max-width:900px;">
  <a href="../dashboard.html" class="btn-add" style="text-decoration:none;"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <button class="btn-primary" style="width:auto;padding:10px 24px;background:#7a1f2b;" id="issueBtn">
    <i class="fa-solid fa-cloud-arrow-up"></i> إصدار وحفظ بقوقل شيت
  </button>
  <button class="btn-primary" style="width:auto;padding:10px 24px;" onclick="window.print()">
    <i class="fa-solid fa-print"></i> طباعة نسخة محلية
  </button>
</div>

<div id="issuedNote"></div>

<div class="report-doc" id="reportDoc">
  <div class="loading-box text-center p-5"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, issueReport } from "../js/report-state.js";
  import { computeIndicatorStatus, STATUS_LABELS } from "../js/components/form-helpers.js";
  import { fieldLabel } from "../js/components/report-labels.js";
  import { SECTIONS } from "../js/components/sections-config.js";

  let reportId, currentReport;

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    const params = new URLSearchParams(window.location.search);
    reportId = params.get("id") || await getOrCreateDraftReport(profile);
    currentReport = await loadReport(reportId);
    if (!currentReport) {
      document.getElementById("reportDoc").innerHTML = `<p class="empty-note">ما فيه بيانات محفوظة لهذا التقرير على هذا الجهاز.</p>`;
      return;
    }
    renderReport(currentReport);
    document.getElementById("issueBtn").addEventListener("click", onIssue);
  });

  // ------- عرض التقرير كامل بكل الأقسام -------

  function renderReport(r) {
    const bd = r.basicData || {};

    document.getElementById("reportDoc").innerHTML = `
      <div class="report-header">
        <div class="logo-box"><img src="../furqan-logo.png" alt="شعار جمعية فرقان"></div>
        <div class="titles">
          <h1>تقرير أداء دوري</h1>
          <p>جمعية فرقان لتحفيظ القرآن الكريم - الطائف</p>
        </div>
      </div>

      <table class="meta-table">
        <tr><td class="label">الجهة</td><td>${bd.departmentName || "-"} ${bd.unitName ? "/ " + bd.unitName : ""}</td>
            <td class="label">الفترة</td><td>${bd.periodType || "-"} ${bd.hijriYear || ""}</td></tr>
        <tr><td class="label">معدة التقرير</td><td>${bd.preparerName || "-"}</td>
            <td class="label">الرئيسة المباشرة</td><td>${bd.directManager || "-"}</td></tr>
        <tr><td class="label">تاريخ البداية</td><td>${bd.startDate || "-"}</td>
            <td class="label">تاريخ النهاية</td><td>${bd.endDate || "-"}</td></tr>
      </table>

      <div class="section-title">مؤشرات الأداء (${(r.indicators || []).length})</div>
      ${renderIndicatorsTable(r.indicators || [])}

      ${SECTIONS.filter(s => s.enabled !== false && s.key !== "basic-data" && s.key !== "indicators")
        .map(s => renderGenericSection(s.title, r[toSectionKey(s.key)])).join("")}
    `;
  }

  // تحويل مفتاح القسم بملف sections-config.js (kebab-case) إلى نفس المفتاح
  // المستخدم بتخزين البيانات (camelCase) - نفس التحويل المستخدم بكل الصفحات
  function toSectionKey(kebabKey) {
    return kebabKey.replace(/-([a-z])/g, (m, c) => c.toUpperCase());
  }

  function renderIndicatorsTable(indicators) {
    if (indicators.length === 0) return `<p class="empty-note">لا توجد مؤشرات مسجلة.</p>`;
    return `<table class="data-table">
      <thead><tr><th>المؤشر</th><th>المستهدف</th><th>المتحقق</th><th>الحالة</th></tr></thead>
      <tbody>
        ${indicators.map(i => {
          const status = i.status || computeIndicatorStatus(i.baseline, i.target, i.actual, i.direction);
          return `<tr>
            <td>${i.name || "-"}</td><td>${i.target ?? "-"}</td><td>${i.actual ?? "-"}</td>
            <td><span class="status-tag ${status}">${STATUS_LABELS[status]}</span></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
  }

  // عرض عام لأي قسم: يشتغل على شكل مصفوفة عناصر (أقسام قابلة للتكرار)
  // أو كائن بيانات وحد (أقسام غير متكررة)، ويستخدم خريطة التسميات
  // العربية لعرض كل حقل بلغة مفهومة بدل اسمه بالكود.
  function renderGenericSection(title, data) {
    let bodyHtml;
    if (Array.isArray(data)) {
      if (data.length === 0) {
        bodyHtml = `<p class="empty-note">لا توجد عناصر.</p>`;
      } else {
        bodyHtml = data.map((item, i) => `
          <div class="item-card">
            <div class="item-row"><span class="k">#${i + 1}</span></div>
            ${renderFields(item)}
          </div>
        `).join("");
      }
    } else if (data && Object.keys(data).length > 0) {
      bodyHtml = `<div class="item-card">${renderFields(data)}</div>`;
    } else {
      bodyHtml = `<p class="empty-note">لا توجد بيانات.</p>`;
    }
    return `<div class="section-title">${title}</div>${bodyHtml}`;
  }

  function renderFields(obj) {
    return Object.keys(obj).map(key => {
      let val = obj[key];
      if (val === "" || val === null || val === undefined) return "";
      if (Array.isArray(val)) val = val.join("، ");
      return `<div class="item-row"><span class="k">${fieldLabel(key)}:</span><span class="v">${val}</span></div>`;
    }).join("");
  }

  // ------- إصدار: تحويل التقرير لملف PDF ورفعه لقوقل شيت -------

  async function onIssue() {
    const btn = document.getElementById("issueBtn");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جارٍ التجهيز والرفع...`;

    try {
      const fileName = "تقرير-" + (currentReport?.basicData?.unitName || currentReport?.basicData?.departmentName || "أداء") + ".pdf";
      const worker = html2pdf()
        .set({
          margin: 10,
          filename: fileName,
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        })
        .from(document.getElementById("reportDoc"));

      const pdfBlob = await worker.outputPdf("blob");
      const base64 = await blobToBase64(pdfBlob);

      const res = await issueReport(reportId, base64, fileName);

      document.getElementById("issuedNote").innerHTML = `
        <div class="issued-note page-wrap" style="max-width:900px;">
          <i class="fa-solid fa-circle-check"></i> تم إصدار التقرير ورفعه بنجاح.
          <a href="${res.pdfUrl}" target="_blank" rel="noopener">فتح ملف الـ PDF</a>
        </div>`;
      btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> تم الإصدار`;
    } catch (err) {
      console.error(err);
      alert(err.message || "تعذّر إصدار التقرير، حاولي مجددًا");
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
</script>
</body>
</html>
