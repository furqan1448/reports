<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل النتائج | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .form-section { background:#fff; border-radius:14px; padding:22px; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:20px; }
  .form-section h4 { color:var(--maroon-900); font-size:1.02rem; margin-bottom:16px; border-bottom:2px solid var(--gold-100); padding-bottom:10px; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-box { background:linear-gradient(135deg, var(--maroon-900), var(--maroon-700)); color:#fff; border-radius:14px; padding:16px; text-align:center; }
  .stat-box .num { font-size:1.7rem; font-weight:800; color:var(--gold-400); }
  .stat-box .lbl { font-size:.78rem; opacity:.9; margin-top:4px; }
  .chart-wrap { background:#fffdf8; border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
  .chart-wrap h5 { font-size:.9rem; color:var(--maroon-800); margin-bottom:10px; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:900px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-magnifying-glass-chart"></i> تحليل النتائج</h2>
    <p>إحصاءات محسوبة تلقائيًا من كل الأقسام المحفوظة في هذا التقرير.</p>
  </div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="row g-3 mb-2">
    <div class="col-md-6">
      <div class="chart-wrap">
        <h5><i class="fa-solid fa-chart-pie"></i> توزيع حالة المؤشرات</h5>
        <canvas id="statusChart" height="200"></canvas>
      </div>
    </div>
    <div class="col-md-6">
      <div class="chart-wrap">
        <h5><i class="fa-solid fa-chart-bar"></i> نسبة إنجاز الأعمال والبرامج</h5>
        <canvas id="programsChart" height="200"></canvas>
      </div>
    </div>
  </div>

  <form id="analysisForm">
    <div class="form-section">
      <h4>أبرز النتائج الإيجابية</h4>
      <textarea class="form-control" id="positiveResults" rows="3"></textarea>
    </div>
    <div class="form-section">
      <h4>المقارنة بالفترة السابقة</h4>
      <textarea class="form-control" id="periodComparison" rows="3"></textarea>
    </div>
    <div class="form-section">
      <h4>خلاصة التحليل العامة</h4>
      <textarea class="form-control" id="generalSummary" rows="3"></textarea>
    </div>

    <div class="form-actions d-flex justify-content-between">
      <span class="text-muted small" id="lastSaved"></span>
      <button type="submit" class="btn-primary" style="width:auto; padding:12px 32px;">
        <i class="fa-solid fa-floppy-disk"></i> حفظ التحليل
      </button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveSection } from "../js/report-state.js";
  import { showSaveToast, computeIndicatorStatus, STATUS_LABELS } from "../js/components/form-helpers.js";

  let reportId, report;

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    report = await loadReport(reportId);
    renderStats();
    renderCharts();
    hydrateForm();
    document.getElementById("analysisForm").addEventListener("submit", onSubmit);
  });

  function renderStats() {
    const indicators = report?.indicators || [];
    const programs = report?.programs || [];
    const strengths = report?.strengths || [];
    const difficulties = report?.difficulties || [];
    const initiatives = report?.initiatives || [];
    const stories = report?.impactStories || [];
    const recs = report?.recommendations || [];

    const avgCompletion = programs.length
      ? Math.round(programs.reduce((sum, p) => {
          const t = Number(p.targetCount) || 0;
          const a = Number(p.actualBeneficiaries) || 0;
          return sum + (t > 0 ? (a / t) * 100 : 0);
        }, 0) / programs.length)
      : 0;

    const stats = [
      { num: indicators.length, lbl: "عدد المؤشرات" },
      { num: programs.length, lbl: "عدد البرامج" },
      { num: `${avgCompletion}%`, lbl: "متوسط الإنجاز" },
      { num: strengths.length, lbl: "نقاط القوة" },
      { num: difficulties.length, lbl: "الصعوبات" },
      { num: initiatives.length, lbl: "المبادرات" },
      { num: stories.length, lbl: "قصص النجاح" },
      { num: recs.length, lbl: "التوصيات" }
    ];

    document.getElementById("statGrid").innerHTML = stats.map(s => `
      <div class="stat-box">
        <div class="num">${s.num}</div>
        <div class="lbl">${s.lbl}</div>
      </div>
    `).join("");
  }

  function renderCharts() {
    const indicators = report?.indicators || [];
    const counts = { done: 0, near: 0, warn: 0, fail: 0, none: 0 };
    indicators.forEach(ind => {
      const status = ind.status || computeIndicatorStatus(ind.baseline, ind.target, ind.actual, ind.direction);
      counts[status] = (counts[status] || 0) + 1;
    });

    new Chart(document.getElementById("statusChart"), {
      type: "doughnut",
      data: {
        labels: Object.keys(counts).map(k => STATUS_LABELS[k]),
        datasets: [{
          data: Object.values(counts),
          backgroundColor: ["#1e8e5a", "#d9a441", "#e07b25", "#c0392b", "#9aa0a6"]
        }]
      },
      options: { plugins: { legend: { position: "bottom", labels: { font: { family: "Tajawal" } } } } }
    });

    const programs = report?.programs || [];
    new Chart(document.getElementById("programsChart"), {
      type: "bar",
      data: {
        labels: programs.map((p, i) => p.name || `عمل ${i + 1}`).slice(0, 8),
        datasets: [{
          label: "نسبة الإنجاز %",
          data: programs.map(p => {
            const t = Number(p.targetCount) || 0;
            const a = Number(p.actualBeneficiaries) || 0;
            return t > 0 ? Math.round((a / t) * 100) : 0;
          }).slice(0, 8),
          backgroundColor: "#8f2140"
        }]
      },
      options: {
        scales: { y: { beginAtZero: true, max: 100 } },
        plugins: { legend: { display: false } }
      }
    });
  }

  function hydrateForm() {
    const d = report?.resultsAnalysis;
    if (!d) return;
    if (d.positiveResults) document.getElementById("positiveResults").value = d.positiveResults;
    if (d.periodComparison) document.getElementById("periodComparison").value = d.periodComparison;
    if (d.generalSummary) document.getElementById("generalSummary").value = d.generalSummary;
  }

  async function onSubmit(e) {
    e.preventDefault();
    const data = {
      positiveResults: document.getElementById("positiveResults").value,
      periodComparison: document.getElementById("periodComparison").value,
      generalSummary: document.getElementById("generalSummary").value
    };
    try {
      await saveSection(reportId, "resultsAnalysis", data);
      showSaveToast("تم حفظ تحليل النتائج بنجاح");
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
