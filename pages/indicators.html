<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤشرات الأداء | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .card-item { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; background:#fffdf8; box-shadow: var(--shadow-card); }
  .card-item .card-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-item .card-item-head .title { font-weight:700; color: var(--maroon-900); }
  .btn-remove { background:transparent; border:none; color:var(--status-fail); cursor:pointer; font-size:.9rem; }
  .deviation-box { background:#fdecea; border:1px solid #f5c6cb; border-radius:12px; padding:14px; margin-top:14px; }
  .deviation-box .dv-title { color:var(--status-fail); font-weight:700; font-size:.88rem; margin-bottom:10px; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
  .field-label { font-size:.82rem; font-weight:600; margin-bottom:4px; display:block; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:860px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-chart-line"></i> مؤشرات الأداء</h2>
    <p>أضيفي عددًا غير محدود من المؤشرات. تُحسب الحالة تلقائيًا بناءً على المستهدف والمتحقق واتجاه المؤشر.</p>
  </div>

  <div id="indicatorsContainer"></div>

  <button type="button" class="btn-add mb-4" id="addIndicatorBtn">
    <i class="fa-solid fa-plus"></i> إضافة مؤشر
  </button>

  <div class="form-actions d-flex justify-content-between">
    <span class="text-muted small" id="lastSaved"></span>
    <button type="button" class="btn-primary" id="saveBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-floppy-disk"></i> حفظ جميع المؤشرات
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveArraySection } from "../js/report-state.js";
  import { showSaveToast, computeIndicatorStatus, renderStatusPill } from "../js/components/form-helpers.js";
  import { RepeatableList } from "../js/components/repeatable-list.js";

  let reportId;

  const CLASSIFICATIONS = ["كفاءة","فاعلية","جودة","إنتاجية","رضا","أثر","التزام","نمو","زمن إنجاز","تكلفة"];
  const DIRECTIONS = [
    { value: "asc", label: "تصاعدي: الارتفاع أفضل" },
    { value: "desc", label: "تنازلي: الانخفاض أفضل" },
    { value: "range", label: "ضمن نطاق محدد" }
  ];
  const NATURES = ["تراكمي", "غير تراكمي"];
  const FREQUENCIES = ["أسبوعي","شهري","ربع سنوي","فصلي","نصف سنوي","سنوي"];
  const UNITS = ["عدد","نسبة","متوسط","مدة","درجة","ريال"];

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initList();
    const report = await loadReport(reportId);
    list.setItems(report?.indicators || []);
    document.getElementById("saveBtn").addEventListener("click", onSave);
  });

  let list;

  function initList() {
    const container = document.getElementById("indicatorsContainer");

    list = new RepeatableList({
      container,
      itemLabel: "مؤشر",
      itemFactory: () => ({
        name: "", isNew: false, classification: "", direction: "asc", nature: "تراكمي",
        frequency: "شهري", baseline: "", target: "", actual: "", unit: "نسبة",
        previousPeriod: "", dataSource: "", status: "none",
        deviationAmount: "", deviationReason: "", reasonType: "internal",
        correctiveAction: "", responsible: "", closingDate: "", supportNeeded: ""
      }),
      renderItem: (item, i) => renderIndicatorCard(item, i),
      onAfterRender: (item, i, card) => bindIndicatorCard(item, i, card)
    });

    document.getElementById("addIndicatorBtn").addEventListener("click", () => list.addItem());
  }

  function renderIndicatorCard(item, i) {
    return `
    <div class="card-item" data-item-index="${i}">
      <div class="card-item-head">
        <span class="title">مؤشر ${i + 1}${item.name ? ": " + item.name : ""}</span>
        <div class="d-flex align-items-center gap-2">
          <span class="status-pill-mount"></span>
          <button type="button" class="btn-remove" data-action="remove-item"><i class="fa-solid fa-trash"></i> حذف</button>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-8">
          <label class="field-label">اسم المؤشر</label>
          <input type="text" class="form-control" data-field="name" value="${escapeAttr(item.name)}" placeholder="اكتبي اسم المؤشر أو اختاري (مؤشر جديد)">
        </div>
        <div class="col-md-4">
          <label class="field-label">تصنيف المؤشر</label>
          <select class="form-control" data-field="classification">
            <option value="">اختاري...</option>
            ${CLASSIFICATIONS.map(c => `<option value="${c}" ${item.classification===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>

        <div class="col-md-4">
          <label class="field-label">اتجاه المؤشر</label>
          <select class="form-control" data-field="direction">
            ${DIRECTIONS.map(d => `<option value="${d.value}" ${item.direction===d.value?"selected":""}>${d.label}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-4">
          <label class="field-label">طبيعة المؤشر</label>
          <select class="form-control" data-field="nature">
            ${NATURES.map(n => `<option ${item.nature===n?"selected":""}>${n}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-4">
          <label class="field-label">دورية القياس</label>
          <select class="form-control" data-field="frequency">
            ${FREQUENCIES.map(f => `<option ${item.frequency===f?"selected":""}>${f}</option>`).join("")}
          </select>
        </div>

        <div class="col-md-2">
          <label class="field-label">خط الأساس</label>
          <input type="number" class="form-control" data-field="baseline" value="${escapeAttr(item.baseline)}">
        </div>
        <div class="col-md-2">
          <label class="field-label">المستهدف</label>
          <input type="number" class="form-control" data-field="target" value="${escapeAttr(item.target)}">
        </div>
        <div class="col-md-2">
          <label class="field-label">المتحقق</label>
          <input type="number" class="form-control" data-field="actual" value="${escapeAttr(item.actual)}">
        </div>
        <div class="col-md-2">
          <label class="field-label">وحدة القياس</label>
          <select class="form-control" data-field="unit">
            ${UNITS.map(u => `<option ${item.unit===u?"selected":""}>${u}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-2">
          <label class="field-label">الفترة السابقة</label>
          <input type="number" class="form-control" data-field="previousPeriod" value="${escapeAttr(item.previousPeriod)}">
        </div>
        <div class="col-md-2">
          <label class="field-label">مصدر البيانات</label>
          <input type="text" class="form-control" data-field="dataSource" value="${escapeAttr(item.dataSource)}">
        </div>
      </div>

      <div class="deviation-section"></div>
    </div>`;
  }

  function bindIndicatorCard(item, i, card) {
    if (!card) return;

    const status = computeIndicatorStatus(item.baseline, item.target, item.actual, item.direction);
    item.status = status;

    const pillMount = card.querySelector(".status-pill-mount");
    if (pillMount) pillMount.innerHTML = renderStatusPill(status);

    const devSection = card.querySelector(".deviation-section");
    const isFailing = status === "warn" || status === "fail";

    if (isFailing) {
      devSection.innerHTML = `
        <div class="deviation-box">
          <div class="dv-title"><i class="fa-solid fa-triangle-exclamation"></i> حقول الانحراف (تظهر لأن المؤشر لم يتحقق)</div>
          <div class="row g-2">
            <div class="col-md-4">
              <label class="field-label">مقدار الانحراف</label>
              <input type="text" class="form-control" data-field="deviationAmount" value="${escapeAttr(item.deviationAmount)}">
            </div>
            <div class="col-md-4">
              <label class="field-label">سبب الانحراف</label>
              <input type="text" class="form-control" data-field="deviationReason" value="${escapeAttr(item.deviationReason)}">
            </div>
            <div class="col-md-4">
              <label class="field-label">هل السبب داخلي أم خارجي؟</label>
              <select class="form-control" data-field="reasonType">
                <option value="internal" ${item.reasonType==="internal"?"selected":""}>داخلي</option>
                <option value="external" ${item.reasonType==="external"?"selected":""}>خارجي</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="field-label">الإجراء التصحيحي</label>
              <input type="text" class="form-control" data-field="correctiveAction" value="${escapeAttr(item.correctiveAction)}">
            </div>
            <div class="col-md-3">
              <label class="field-label">المسؤولة عن الإجراء</label>
              <input type="text" class="form-control" data-field="responsible" value="${escapeAttr(item.responsible)}">
            </div>
            <div class="col-md-3">
              <label class="field-label">موعد إغلاق المعالجة</label>
              <input type="date" class="form-control" data-field="closingDate" value="${escapeAttr(item.closingDate)}">
            </div>
            <div class="col-12">
              <label class="field-label">الدعم المطلوب</label>
              <input type="text" class="form-control" data-field="supportNeeded" value="${escapeAttr(item.supportNeeded)}">
            </div>
          </div>
        </div>`;
    } else {
      devSection.innerHTML = "";
    }
  }

  function escapeAttr(v) {
    if (v === undefined || v === null) return "";
    return String(v).replace(/"/g, "&quot;");
  }

  async function onSave() {
    try {
      await saveArraySection(reportId, "indicators", list.getItems());
      showSaveToast(`تم حفظ ${list.getItems().length} مؤشر بنجاح`);
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
