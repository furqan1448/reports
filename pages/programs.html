<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأعمال والبرامج | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .card-item { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; background:#fffdf8; box-shadow: var(--shadow-card); }
  .card-item .card-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-item .card-item-head .title { font-weight:700; color: var(--maroon-900); }
  .btn-remove { background:transparent; border:none; color:var(--status-fail); cursor:pointer; font-size:.9rem; }
  .field-label { font-size:.82rem; font-weight:600; margin-bottom:4px; display:block; }
  .subhead { font-size:.85rem; font-weight:700; color:var(--maroon-800); margin: 14px 0 8px; }
  .auto-calc { background: var(--gold-100); border-radius: 8px; padding: 6px 10px; font-size: .82rem; font-weight:700; color: var(--maroon-800); display:inline-block; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:860px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-diagram-project"></i> الأعمال والبرامج المنفذة</h2>
    <p>أضيفي عددًا غير محدود من الأعمال. تُحسب نسبة الإنجاز والحضور تلقائيًا.</p>
  </div>

  <div id="programsContainer"></div>

  <button type="button" class="btn-add mb-4" id="addProgramBtn">
    <i class="fa-solid fa-plus"></i> إضافة برنامج أو عمل
  </button>

  <div class="form-actions d-flex justify-content-between">
    <span class="text-muted small" id="lastSaved"></span>
    <button type="button" class="btn-primary" id="saveBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-floppy-disk"></i> حفظ جميع الأعمال
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveArraySection } from "../js/report-state.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { RepeatableList } from "../js/components/repeatable-list.js";

  let reportId, list;

  const WORK_TYPES = [
    "حلقة قرآنية","برنامج تعليمي","برنامج تربوي","دورة تدريبية","لقاء","ورشة عمل",
    "زيارة إشرافية","اختبار","مبادرة","مشروع","دراسة","استبانة","اجتماع",
    "خدمة للمستفيدات","إنتاج دليل أو أداة","أخرى"
  ];
  const EXEC_MODES = ["حضوري","عن بُعد","مدمج"];
  const EXEC_STATUS = ["مكتمل","مستمر","متعثر","مؤجل","ملغى"];

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initList();
    const report = await loadReport(reportId);
    list.setItems(report?.programs || []);
    document.getElementById("saveBtn").addEventListener("click", onSave);
  });

  function initList() {
    const container = document.getElementById("programsContainer");
    list = new RepeatableList({
      container,
      itemLabel: "عمل / برنامج",
      itemFactory: () => ({
        workType: "", otherWorkType: "", name: "", goal: "", targetGroup: "",
        targetCount: "", actualBeneficiaries: "", startDate: "", endDate: "",
        location: "", mode: "حضوري", executingEntity: "", partners: "", responsible: "",
        executionStatus: "مستمر", attendeesCount: "", continuationRate: "",
        approvedCost: "", actualCost: "", keyResult: ""
      }),
      renderItem: (item, i) => renderProgramCard(item, i),
      onAfterRender: (item, i, card) => bindProgramCard(item, i, card)
    });
    document.getElementById("addProgramBtn").addEventListener("click", () => list.addItem());
  }

  function renderProgramCard(item, i) {
    return `
    <div class="card-item" data-item-index="${i}">
      <div class="card-item-head">
        <span class="title">عمل ${i + 1}${item.name ? ": " + item.name : ""}</span>
        <button type="button" class="btn-remove" data-action="remove-item"><i class="fa-solid fa-trash"></i> حذف</button>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="field-label">نوع العمل</label>
          <select class="form-control" data-field="workType">
            <option value="">اختاري...</option>
            ${WORK_TYPES.map(t => `<option ${item.workType===t?"selected":""}>${t}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-6 ${item.workType==="أخرى"?"":"d-none"}" data-other-work>
          <label class="field-label">حددي نوع العمل</label>
          <input type="text" class="form-control" data-field="otherWorkType" value="${escapeAttr(item.otherWorkType)}">
        </div>

        <div class="col-md-6">
          <label class="field-label">اسم العمل</label>
          <input type="text" class="form-control" data-field="name" value="${escapeAttr(item.name)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الهدف منه</label>
          <input type="text" class="form-control" data-field="goal" value="${escapeAttr(item.goal)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الفئة المستهدفة</label>
          <input type="text" class="form-control" data-field="targetGroup" value="${escapeAttr(item.targetGroup)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">العدد المستهدف</label>
          <input type="number" class="form-control" data-field="targetCount" value="${escapeAttr(item.targetCount)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">عدد المستفيدات الفعلي</label>
          <input type="number" class="form-control" data-field="actualBeneficiaries" value="${escapeAttr(item.actualBeneficiaries)}">
        </div>

        <div class="col-md-3">
          <label class="field-label">تاريخ البداية</label>
          <input type="date" class="form-control" data-field="startDate" value="${escapeAttr(item.startDate)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">تاريخ النهاية</label>
          <input type="date" class="form-control" data-field="endDate" value="${escapeAttr(item.endDate)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">مقر التنفيذ</label>
          <input type="text" class="form-control" data-field="location" value="${escapeAttr(item.location)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">طريقة التنفيذ</label>
          <select class="form-control" data-field="mode">
            ${EXEC_MODES.map(m => `<option ${item.mode===m?"selected":""}>${m}</option>`).join("")}
          </select>
        </div>

        <div class="col-md-4">
          <label class="field-label">الجهة المنفذة</label>
          <input type="text" class="form-control" data-field="executingEntity" value="${escapeAttr(item.executingEntity)}">
        </div>
        <div class="col-md-4">
          <label class="field-label">الجهات المشاركة</label>
          <input type="text" class="form-control" data-field="partners" value="${escapeAttr(item.partners)}">
        </div>
        <div class="col-md-4">
          <label class="field-label">المسؤولة عن التنفيذ</label>
          <input type="text" class="form-control" data-field="responsible" value="${escapeAttr(item.responsible)}">
        </div>

        <div class="col-md-4">
          <label class="field-label">حالة التنفيذ</label>
          <select class="form-control" data-field="executionStatus">
            ${EXEC_STATUS.map(s => `<option ${item.executionStatus===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="subhead">مستوى الإنجاز</div>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="field-label">عدد الحاضرات</label>
          <input type="number" class="form-control" data-field="attendeesCount" value="${escapeAttr(item.attendeesCount)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">نسبة الاستمرار %</label>
          <input type="number" class="form-control" data-field="continuationRate" value="${escapeAttr(item.continuationRate)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">التكلفة المعتمدة</label>
          <input type="number" class="form-control" data-field="approvedCost" value="${escapeAttr(item.approvedCost)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">التكلفة الفعلية</label>
          <input type="number" class="form-control" data-field="actualCost" value="${escapeAttr(item.actualCost)}">
        </div>
        <div class="col-12 auto-calc-mount"></div>
      </div>

      <div class="mt-3">
        <label class="field-label">أبرز نتيجة (جملة واحدة تصف النتيجة، وليس النشاط فقط)</label>
        <input type="text" class="form-control" data-field="keyResult" value="${escapeAttr(item.keyResult)}">
      </div>
    </div>`;
  }

  function bindProgramCard(item, i, card) {
    if (!card) return;

    const otherWrap = card.querySelector("[data-other-work]");
    if (otherWrap) otherWrap.classList.toggle("d-none", item.workType !== "أخرى");

    const target = Number(item.targetCount) || 0;
    const actual = Number(item.actualBeneficiaries) || 0;
    const completionRate = target > 0 ? Math.round((actual / target) * 100) : 0;
    const attendanceRate = target > 0 ? Math.round((Number(item.attendeesCount || 0) / target) * 100) : 0;

    const mount = card.querySelector(".auto-calc-mount");
    if (mount) {
      mount.innerHTML = `
        <span class="auto-calc"><i class="fa-solid fa-calculator"></i> نسبة الإنجاز: ${completionRate}%</span>
        &nbsp;
        <span class="auto-calc"><i class="fa-solid fa-users"></i> نسبة الحضور: ${attendanceRate}%</span>
      `;
    }
  }

  function escapeAttr(v) {
    if (v === undefined || v === null) return "";
    return String(v).replace(/"/g, "&quot;");
  }

  async function onSave() {
    try {
      await saveArraySection(reportId, "programs", list.getItems());
      showSaveToast(`تم حفظ ${list.getItems().length} عمل/برنامج بنجاح`);
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
