<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحليل الذكي | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .form-section { background:#fff; border-radius:14px; padding:22px; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:20px; }
  .form-section h4 { color:var(--maroon-900); font-size:1.02rem; margin-bottom:16px; border-bottom:2px solid var(--gold-100); padding-bottom:10px; }
  .ai-output { background:#fffdf8; border:1px solid var(--gold-500); border-radius:14px; padding:22px; line-height:1.9; white-space:pre-wrap; }
  .ai-output h5 { color:var(--maroon-900); font-size:.95rem; margin:16px 0 8px; border-right:4px solid var(--gold-500); padding-right:10px; }
  .ai-output h5:first-child { margin-top:0; }
  .loading-box { text-align:center; padding:40px; color:var(--text-muted); }
  .setup-note { background:var(--gold-100); color:var(--maroon-800); font-size:.82rem; padding:12px 16px; border-radius:10px; margin-bottom:18px; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:820px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-wand-magic-sparkles"></i> التحليل الذكي</h2>
    <p>تحليل تلقائي لبيانات التقرير الحالي باستخدام الذكاء الاصطناعي.</p>
  </div>

  <div class="setup-note" id="setupNote">
    <i class="fa-solid fa-circle-info"></i>
    هذه الميزة تحتاج مفتاح Anthropic API. إذا لم يُضبط بعد، تواصلي مع فريق التطوير لإضافته في <code>js/ai-config.js</code>.
  </div>

  <div class="form-section">
    <button type="button" class="btn-primary" id="generateBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-sparkles"></i> توليد التحليل
    </button>
  </div>

  <div id="resultBox"></div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport } from "../js/report-state.js";
  import { ANTHROPIC_API_KEY } from "../js/ai-config.js";

  let reportId, report;

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    report = await loadReport(reportId);

    if (ANTHROPIC_API_KEY && ANTHROPIC_API_KEY !== "PASTE_YOUR_ANTHROPIC_API_KEY_HERE") {
      document.getElementById("setupNote").style.display = "none";
    }

    document.getElementById("generateBtn").addEventListener("click", generateAnalysis);
  });

  function buildPrompt() {
    const bd = report?.basicData || {};
    const summary = {
      الجهة: bd.unitName || bd.departmentName || "غير محدد",
      الفترة: `${bd.periodType || ""} ${bd.hijriYear || ""}`,
      المؤشرات: (report?.indicators || []).map(i => ({ الاسم: i.name, الحالة: i.status, المستهدف: i.target, المتحقق: i.actual })),
      البرامج: (report?.programs || []).map(p => ({ الاسم: p.name, الحالة: p.executionStatus, أبرز_نتيجة: p.keyResult })),
      نقاط_القوة: (report?.strengths || []).map(s => s.description),
      الصعوبات: (report?.difficulties || []).map(d => d.description),
      فرص_التحسين: (report?.improvementOpportunities || []).map(o => o.area),
      التوصيات: (report?.recommendations || []).map(r => r.text),
      خطة_الفترة_القادمة: (report?.nextPeriodPlan || []).map(p => p.name)
    };

    return `أنت محللة أداء مؤسسية خبيرة تكتبين باللغة العربية الفصحى الاحترافية.
لديك بيانات تقرير أداء وحدة تابعة لجمعية فرقان لتحفيظ القرآن الكريم بالطائف. حللي البيانات التالية (بصيغة JSON) وأنتجي تقريرًا تحليليًا يتضمن الأقسام السبعة التالية بالضبط، كل قسم بعنوان واضح:

1. ملخص تنفيذي (فقرة موجزة، 3-4 جمل)
2. أهم المنجزات
3. أهم الصعوبات
4. نقاط القوة
5. فرص التحسين
6. التوصيات
7. أولويات الفترة القادمة

اكتبي بأسلوب مؤسسي احترافي مباشر، بدون مبالغة، معتمدة فقط على البيانات المعطاة دون اختلاق أرقام أو وقائع غير موجودة.

البيانات:
${JSON.stringify(summary, null, 2)}`;
  }

  async function generateAnalysis() {
    const resultBox = document.getElementById("resultBox");
    const btn = document.getElementById("generateBtn");

    if (!ANTHROPIC_API_KEY || ANTHROPIC_API_KEY === "PASTE_YOUR_ANTHROPIC_API_KEY_HERE") {
      resultBox.innerHTML = `<div class="alert alert-error show">لم يتم ضبط مفتاح API بعد. راجعي ملف js/ai-config.js.</div>`;
      return;
    }

    btn.disabled = true;
    resultBox.innerHTML = `<div class="loading-box"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p class="mt-3">جارٍ توليد التحليل...</p></div>`;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": ANTHROPIC_API_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 2000,
          messages: [{ role: "user", content: buildPrompt() }]
        })
      });

      const data = await response.json();
      const text = (data.content || []).map(c => c.text || "").join("\n");
      resultBox.innerHTML = `<div class="ai-output">${formatOutput(text)}</div>`;
    } catch (err) {
      console.error(err);
      resultBox.innerHTML = `<div class="alert alert-error show">تعذر توليد التحليل. تحققي من الاتصال ومفتاح API.</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function formatOutput(text) {
    return text
      .replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/^(\d\.\s.+)$/gm, "<h5>$1</h5>")
      .replace(/\n/g, "<br>");
  }
</script>
</body>
</html>
