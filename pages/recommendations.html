<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التوصيات | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .card-item { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; background:#fffdf8; box-shadow: var(--shadow-card); }
  .card-item .card-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-item .card-item-head .title { font-weight:700; color: var(--maroon-900); }
  .btn-remove { background:transparent; border:none; color:var(--status-fail); cursor:pointer; font-size:.9rem; }
  .field-label { font-size:.82rem; font-weight:600; margin-bottom:4px; display:block; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
  .priority-badge { font-size:.72rem; font-weight:700; padding:2px 9px; border-radius:999px; }
  .priority-urgent { background:#fdecea; color:var(--status-fail); }
  .priority-high { background:#fdece0; color:var(--status-warn); }
  .priority-medium { background:#fbf1dd; color:var(--status-near); }
  .priority-low { background:#f1f1f2; color:var(--status-none); }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:860px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-list-check"></i> التوصيات</h2>
    <p>اربطي كل توصية بالنتيجة التي بُنيت عليها.</p>
  </div>

  <div id="recommendationsContainer"></div>

  <button type="button" class="btn-add mb-4" id="addRecBtn">
    <i class="fa-solid fa-plus"></i> إضافة توصية
  </button>

  <div class="form-actions d-flex justify-content-between">
    <span class="text-muted small" id="lastSaved"></span>
    <button type="button" class="btn-primary" id="saveBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-floppy-disk"></i> حفظ التوصيات
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveArraySection } from "../js/report-state.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { RepeatableList } from "../js/components/repeatable-list.js";

  let reportId, list;

  const PRIORITIES = [
    { value: "urgent", label: "عاجلة", cls: "priority-urgent" },
    { value: "high", label: "عالية", cls: "priority-high" },
    { value: "medium", label: "متوسطة", cls: "priority-medium" },
    { value: "low", label: "منخفضة", cls: "priority-low" }
  ];

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initList();
    const report = await loadReport(reportId);
    list.setItems(report?.recommendations || []);
    document.getElementById("saveBtn").addEventListener("click", onSave);
  });

  function initList() {
    const container = document.getElementById("recommendationsContainer");
    list = new RepeatableList({
      container,
      itemLabel: "توصية",
      itemFactory: () => ({
        text: "", basedOn: "", priority: "medium",
        responsibleEntity: "", timeframe: "", successIndicator: ""
      }),
      renderItem: (item, i) => renderCard(item, i),
      onAfterRender: (item, i, card) => bindCard(item, i, card)
    });
    document.getElementById("addRecBtn").addEventListener("click", () => list.addItem());
  }

  function renderCard(item, i) {
    return `
    <div class="card-item" data-item-index="${i}">
      <div class="card-item-head">
        <span class="title">توصية ${i + 1}</span>
        <div class="d-flex align-items-center gap-2">
          <span class="priority-mount"></span>
          <button type="button" class="btn-remove" data-action="remove-item"><i class="fa-solid fa-trash"></i> حذف</button>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-12">
          <label class="field-label">نص التوصية</label>
          <textarea class="form-control" rows="2" data-field="text">${escapeHtml(item.text)}</textarea>
        </div>
        <div class="col-md-6">
          <label class="field-label">مبنية على أي نتيجة (رقم مؤشر / تحليل)</label>
          <input type="text" class="form-control" data-field="basedOn" value="${escapeAttr(item.basedOn)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الأولوية</label>
          <select class="form-control" data-field="priority">
            ${PRIORITIES.map(p => `<option value="${p.value}" ${item.priority===p.value?"selected":""}>${p.label}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-4">
          <label class="field-label">الجهة المسؤولة عن التنفيذ</label>
          <input type="text" class="form-control" data-field="responsibleEntity" value="${escapeAttr(item.responsibleEntity)}">
        </div>
        <div class="col-md-4">
          <label class="field-label">المدة الزمنية المقترحة</label>
          <input type="text" class="form-control" data-field="timeframe" value="${escapeAttr(item.timeframe)}" placeholder="مثال: خلال شهر">
        </div>
        <div class="col-md-4">
          <label class="field-label">مؤشر قياس تنفيذ التوصية</label>
          <input type="text" class="form-control" data-field="successIndicator" value="${escapeAttr(item.successIndicator)}">
        </div>
      </div>
    </div>`;
  }

  function bindCard(item, i, card) {
    if (!card) return;
    const p = PRIORITIES.find(pr => pr.value === item.priority) || PRIORITIES[2];
    const mount = card.querySelector(".priority-mount");
    if (mount) mount.innerHTML = `<span class="priority-badge ${p.cls}">${p.label}</span>`;
  }

  function escapeAttr(v) { return v === undefined || v === null ? "" : String(v).replace(/"/g, "&quot;"); }
  function escapeHtml(v) { return v === undefined || v === null ? "" : String(v).replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  async function onSave() {
    try {
      await saveArraySection(reportId, "recommendations", list.getItems());
      showSaveToast(`تم حفظ ${list.getItems().length} توصية بنجاح`);
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
