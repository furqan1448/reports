<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطة الفترة القادمة | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .card-item { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; background:#fffdf8; box-shadow: var(--shadow-card); }
  .card-item .card-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-item .card-item-head .title { font-weight:700; color: var(--maroon-900); }
  .btn-remove { background:transparent; border:none; color:var(--status-fail); cursor:pointer; font-size:.9rem; }
  .field-label { font-size:.82rem; font-weight:600; margin-bottom:4px; display:block; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
  .limit-note { font-size:.82rem; color:var(--text-muted); }
  .limit-note.warn { color: var(--status-fail); font-weight:700; }
  .limit-note.full { color: var(--status-warn); font-weight:700; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:860px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-calendar-days"></i> خطة الفترة القادمة</h2>
    <p>من ثلاثة إلى خمسة أعمال رئيسة فقط.</p>
  </div>

  <div id="planContainer"></div>

  <div class="d-flex align-items-center gap-3 mb-4">
    <button type="button" class="btn-add" id="addPlanBtn">
      <i class="fa-solid fa-plus"></i> إضافة عمل
    </button>
    <span class="limit-note" id="limitNote"></span>
  </div>

  <div class="form-actions d-flex justify-content-between">
    <span class="text-muted small" id="lastSaved"></span>
    <button type="button" class="btn-primary" id="saveBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-floppy-disk"></i> حفظ الخطة
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveArraySection } from "../js/report-state.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { RepeatableList } from "../js/components/repeatable-list.js";

  let reportId, list;
  const MIN_ITEMS = 3;
  const MAX_ITEMS = 5;

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initList();
    const report = await loadReport(reportId);
    let items = report?.nextPeriodPlan || [];
    if (items.length === 0) {
      items = [list.itemFactory(), list.itemFactory(), list.itemFactory()];
    }
    list.setItems(items);
    updateLimitNote();
    document.getElementById("saveBtn").addEventListener("click", onSave);
  });

  function initList() {
    const container = document.getElementById("planContainer");
    list = new RepeatableList({
      container,
      itemLabel: "عمل",
      maxItems: MAX_ITEMS,
      itemFactory: () => ({
        name: "", goal: "", startDate: "", endDate: "",
        responsible: "", resourcesNeeded: "", successIndicator: ""
      }),
      renderItem: (item, i) => renderCard(item, i),
      onAfterRender: () => updateLimitNote()
    });
    document.getElementById("addPlanBtn").addEventListener("click", () => {
      list.addItem();
      updateLimitNote();
    });
  }

  function updateLimitNote() {
    const note = document.getElementById("limitNote");
    const count = list.getItems().length;
    note.textContent = `${count} / ${MIN_ITEMS}-${MAX_ITEMS} (الحد الأدنى ${MIN_ITEMS}، الأقصى ${MAX_ITEMS})`;
    note.classList.remove("warn", "full");
    if (count < MIN_ITEMS) note.classList.add("warn");
    if (count >= MAX_ITEMS) note.classList.add("full");
    document.getElementById("addPlanBtn").disabled = count >= MAX_ITEMS;
    document.getElementById("addPlanBtn").style.opacity = count >= MAX_ITEMS ? "0.5" : "1";
  }

  function renderCard(item, i) {
    return `
    <div class="card-item" data-item-index="${i}">
      <div class="card-item-head">
        <span class="title">عمل ${i + 1}${item.name ? ": " + item.name : ""}</span>
        <button type="button" class="btn-remove" data-action="remove-item"><i class="fa-solid fa-trash"></i> حذف</button>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="field-label">اسم العمل</label>
          <input type="text" class="form-control" data-field="name" value="${escapeAttr(item.name)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الهدف منه</label>
          <input type="text" class="form-control" data-field="goal" value="${escapeAttr(item.goal)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">تاريخ البداية المتوقع</label>
          <input type="date" class="form-control" data-field="startDate" value="${escapeAttr(item.startDate)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">تاريخ النهاية المتوقع</label>
          <input type="date" class="form-control" data-field="endDate" value="${escapeAttr(item.endDate)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">المسؤولة</label>
          <input type="text" class="form-control" data-field="responsible" value="${escapeAttr(item.responsible)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">الموارد المطلوبة</label>
          <input type="text" class="form-control" data-field="resourcesNeeded" value="${escapeAttr(item.resourcesNeeded)}">
        </div>
        <div class="col-12">
          <label class="field-label">مؤشر النجاح</label>
          <input type="text" class="form-control" data-field="successIndicator" value="${escapeAttr(item.successIndicator)}">
        </div>
      </div>
    </div>`;
  }

  function escapeAttr(v) { return v === undefined || v === null ? "" : String(v).replace(/"/g, "&quot;"); }

  async function onSave() {
    if (list.getItems().length < MIN_ITEMS) {
      showSaveToast(`يلزم إدخال ${MIN_ITEMS} أعمال على الأقل`, true);
      return;
    }
    try {
      await saveArraySection(reportId, "nextPeriodPlan", list.getItems());
      showSaveToast(`تم حفظ خطة الفترة القادمة (${list.getItems().length} أعمال)`);
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
