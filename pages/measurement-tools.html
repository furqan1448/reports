<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدوات القياس | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .card-item { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; background:#fffdf8; box-shadow: var(--shadow-card); }
  .card-item .card-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-item .card-item-head .title { font-weight:700; color: var(--maroon-900); }
  .btn-remove { background:transparent; border:none; color:var(--status-fail); cursor:pointer; font-size:.9rem; }
  .field-label { font-size:.82rem; font-weight:600; margin-bottom:4px; display:block; }
  .subhead { font-size:.85rem; font-weight:700; color:var(--maroon-800); margin: 14px 0 8px; }
  .auto-calc { background: var(--gold-100); border-radius: 8px; padding: 6px 10px; font-size: .82rem; font-weight:700; color: var(--maroon-800); display:inline-block; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:860px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-ruler-combined"></i> أدوات القياس</h2>
    <p>نسبة الاستجابة تُحسب تلقائيًا من عدد المستجيبات وحجم العينة.</p>
  </div>

  <div id="toolsContainer"></div>

  <button type="button" class="btn-add mb-4" id="addToolBtn">
    <i class="fa-solid fa-plus"></i> إضافة أداة قياس
  </button>

  <div class="form-actions d-flex justify-content-between">
    <span class="text-muted small" id="lastSaved"></span>
    <button type="button" class="btn-primary" id="saveBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-floppy-disk"></i> حفظ جميع الأدوات
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveArraySection } from "../js/report-state.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { RepeatableList } from "../js/components/repeatable-list.js";

  let reportId, list;

  const TOOL_TYPES = [
    "استبانة","اختبار قبلي وبعدي","اختبار تحصيلي","بطاقة ملاحظة","قائمة تحقق",
    "مقابلة","مجموعة تركيز","تحليل سجلات","تحليل شكاوى ومقترحات","قياس رضا","قياس أثر","تقييم أداء","أخرى"
  ];
  const QUALITY_OPTIONS = [
    "كافية لاتخاذ قرار","مؤشر أولي يحتاج تعزيز","غير كافية بسبب ضعف الاستجابة",
    "تحتاج إلى إعادة تطبيق","تحتاج إلى أداة إضافية"
  ];

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initList();
    const report = await loadReport(reportId);
    list.setItems(report?.measurementTools || []);
    document.getElementById("saveBtn").addEventListener("click", onSave);
  });

  function initList() {
    const container = document.getElementById("toolsContainer");
    list = new RepeatableList({
      container,
      itemLabel: "أداة قياس",
      itemFactory: () => ({
        toolType: "", otherToolType: "", name: "", purpose: "", relatedEntity: "",
        appliedGroup: "", populationSize: "", sampleSize: "", respondentsCount: "",
        applicationDate: "", toolLink: "", resultsLink: "", quality: ""
      }),
      renderItem: (item, i) => renderToolCard(item, i),
      onAfterRender: (item, i, card) => bindToolCard(item, i, card)
    });
    document.getElementById("addToolBtn").addEventListener("click", () => list.addItem());
  }

  function renderToolCard(item, i) {
    return `
    <div class="card-item" data-item-index="${i}">
      <div class="card-item-head">
        <span class="title">أداة ${i + 1}${item.name ? ": " + item.name : ""}</span>
        <button type="button" class="btn-remove" data-action="remove-item"><i class="fa-solid fa-trash"></i> حذف</button>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="field-label">نوع الأداة</label>
          <select class="form-control" data-field="toolType">
            <option value="">اختاري...</option>
            ${TOOL_TYPES.map(t => `<option ${item.toolType===t?"selected":""}>${t}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-6 ${item.toolType==="أخرى"?"":"d-none"}" data-other-tool>
          <label class="field-label">حددي نوع الأداة</label>
          <input type="text" class="form-control" data-field="otherToolType" value="${escapeAttr(item.otherToolType)}">
        </div>

        <div class="col-md-6">
          <label class="field-label">اسم الأداة</label>
          <input type="text" class="form-control" data-field="name" value="${escapeAttr(item.name)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الهدف من استخدامها</label>
          <input type="text" class="form-control" data-field="purpose" value="${escapeAttr(item.purpose)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الجهة أو البرنامج المرتبط بها</label>
          <input type="text" class="form-control" data-field="relatedEntity" value="${escapeAttr(item.relatedEntity)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">الفئة التي طبقت عليها</label>
          <input type="text" class="form-control" data-field="appliedGroup" value="${escapeAttr(item.appliedGroup)}">
        </div>

        <div class="col-md-3">
          <label class="field-label">حجم المجتمع</label>
          <input type="number" class="form-control" data-field="populationSize" value="${escapeAttr(item.populationSize)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">حجم العينة</label>
          <input type="number" class="form-control" data-field="sampleSize" value="${escapeAttr(item.sampleSize)}">
        </div>
        <div class="col-md-3">
          <label class="field-label">عدد المستجيبات</label>
          <input type="number" class="form-control" data-field="respondentsCount" value="${escapeAttr(item.respondentsCount)}">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <span class="auto-calc response-rate-mount"></span>
        </div>

        <div class="col-md-4">
          <label class="field-label">تاريخ التطبيق</label>
          <input type="date" class="form-control" data-field="applicationDate" value="${escapeAttr(item.applicationDate)}">
        </div>
        <div class="col-md-4">
          <label class="field-label">رابط نسخة الأداة</label>
          <input type="url" class="form-control" data-field="toolLink" value="${escapeAttr(item.toolLink)}" placeholder="https://">
        </div>
        <div class="col-md-4">
          <label class="field-label">رابط نتائجها</label>
          <input type="url" class="form-control" data-field="resultsLink" value="${escapeAttr(item.resultsLink)}" placeholder="https://">
        </div>

        <div class="col-md-8">
          <label class="field-label">جودة نتائج الأداة</label>
          <select class="form-control" data-field="quality">
            <option value="">اختاري...</option>
            ${QUALITY_OPTIONS.map(q => `<option ${item.quality===q?"selected":""}>${q}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>`;
  }

  function bindToolCard(item, i, card) {
    if (!card) return;
    const otherWrap = card.querySelector("[data-other-tool]");
    if (otherWrap) otherWrap.classList.toggle("d-none", item.toolType !== "أخرى");

    const sample = Number(item.sampleSize) || 0;
    const respondents = Number(item.respondentsCount) || 0;
    const rate = sample > 0 ? Math.round((respondents / sample) * 100) : 0;

    const mount = card.querySelector(".response-rate-mount");
    if (mount) mount.innerHTML = `<i class="fa-solid fa-calculator"></i> نسبة الاستجابة: ${rate}%`;
  }

  function escapeAttr(v) {
    if (v === undefined || v === null) return "";
    return String(v).replace(/"/g, "&quot;");
  }

  async function onSave() {
    try {
      await saveArraySection(reportId, "measurementTools", list.getItems());
      showSaveToast(`تم حفظ ${list.getItems().length} أداة قياس بنجاح`);
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
