<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البيانات الأساسية | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .form-section { background:#fff; border-radius:14px; padding:22px; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:20px; }
  .form-section h4 { color:var(--maroon-900); font-size:1.02rem; margin-bottom:16px; border-bottom:2px solid var(--gold-100); padding-bottom:10px; }
  .req::after { content:" *"; color:var(--status-fail); }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:820px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-id-card"></i> البيانات الأساسية</h2>
    <p>بيانات الجهة، الفترة، ومعدة التقرير</p>
  </div>

  <form id="basicDataForm">

    <div class="form-section">
      <h4>الجهة</h4>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label req">الجهة الرئيسة</label>
          <select class="form-control" id="mainEntity" required>
            <option value="إدارة التعليم النسائي" selected>إدارة التعليم النسائي</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label req">الجهة التي ترفع التقرير</label>
          <select class="form-control" id="entityType" required>
            <option value="" disabled selected>اختاري...</option>
            <option value="department">إدارة</option>
            <option value="section">قسم</option>
            <option value="unit">وحدة</option>
            <option value="office">مكتب</option>
            <option value="center">مركز</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label req">اسم الجهة (القسم)</label>
          <select class="form-control" id="departmentName" required></select>
        </div>

        <div class="col-md-6 d-none" id="otherDepartmentWrap">
          <label class="form-label">اسم القسم (أخرى)</label>
          <input type="text" class="form-control" id="otherDepartmentName">
        </div>

        <div class="col-md-6 d-none" id="officeWrap">
          <label class="form-label">اسم المكتب</label>
          <select class="form-control" id="officeName"></select>
        </div>

        <div class="col-md-6" id="unitWrap">
          <label class="form-label">اسم الوحدة</label>
          <select class="form-control" id="unitName">
            <option value="" disabled selected>اختاري القسم أولًا...</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h4>الفترة التي يغطيها التقرير</h4>
      <div class="row g-2 mb-3" id="periodTypeGroup">
        <label class="form-label req">نوع الفترة</label>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt1" value="شهري" required>
            <label class="form-check-label" for="pt1">شهري</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt2" value="ربع سنوي">
            <label class="form-check-label" for="pt2">ربع سنوي</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt3" value="فصلي">
            <label class="form-check-label" for="pt3">فصلي</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt4" value="نصف سنوي">
            <label class="form-check-label" for="pt4">نصف سنوي</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt5" value="سنوي">
            <label class="form-check-label" for="pt5">سنوي</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt6" value="تقرير برنامج أو مشروع">
            <label class="form-check-label" for="pt6">تقرير برنامج أو مشروع</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="periodType" id="pt7" value="صيفي">
            <label class="form-check-label" for="pt7">صيفي</label>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-3 d-none" id="monthWrap">
          <label class="form-label">الشهر</label>
          <select class="form-control" id="month">
            <option>محرم</option><option>صفر</option><option>ربيع الأول</option><option>ربيع الآخر</option>
            <option>جمادى الأولى</option><option>جمادى الآخرة</option><option>رجب</option><option>شعبان</option>
            <option>رمضان</option><option>شوال</option><option>ذو القعدة</option><option>ذو الحجة</option>
          </select>
        </div>
        <div class="col-md-3 d-none" id="semesterWrap">
          <label class="form-label">الفصل</label>
          <select class="form-control" id="semester">
            <option>الأول</option><option>الثاني</option><option>الصيفي</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">العام الهجري</label>
          <select class="form-control" id="hijriYear"></select>
        </div>
        <div class="col-md-3"></div>
        <div class="col-md-3">
          <label class="form-label">تاريخ البداية</label>
          <input type="date" class="form-control" id="startDate">
        </div>
        <div class="col-md-3">
          <label class="form-label">تاريخ النهاية</label>
          <input type="date" class="form-control" id="endDate">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h4>بيانات معدة التقرير</h4>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label req">الاسم</label>
          <input type="text" class="form-control" id="preparerName" required>
        </div>
        <div class="col-md-4">
          <label class="form-label req">المسمى الوظيفي</label>
          <input type="text" class="form-control" id="preparerTitle" required>
        </div>
        <div class="col-md-4">
          <label class="form-label req">اسم الرئيسة المباشرة</label>
          <input type="text" class="form-control" id="directManager" required>
        </div>
      </div>
    </div>

    <div class="form-actions d-flex justify-content-between">
      <span class="text-muted small" id="lastSaved"></span>
      <button type="submit" class="btn-primary" style="width:auto; padding:12px 32px;">
        <i class="fa-solid fa-floppy-disk"></i> حفظ البيانات
      </button>
    </div>
  </form>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveSection } from "../js/report-state.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { DEPARTMENTS, UNITS_BY_DEPARTMENT, OFFICES, HIJRI_YEARS } from "../js/components/org-data.js";

  let reportId;

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initSelects();
    bindLogic();
    await hydrateForm();
  });

  function initSelects() {
    const deptSel = document.getElementById("departmentName");
    deptSel.innerHTML = `<option value="" disabled selected>اختاري...</option>` +
      DEPARTMENTS.map(d => `<option value="${d}">${d}</option>`).join("");

    const officeSel = document.getElementById("officeName");
    officeSel.innerHTML = OFFICES.map(o => `<option value="${o}">${o}</option>`).join("");

    const yearSel = document.getElementById("hijriYear");
    yearSel.innerHTML = HIJRI_YEARS.map(y => `<option value="${y}">${y}</option>`).join("");
  }

  function bindLogic() {
    document.getElementById("entityType").addEventListener("change", (e) => {
      document.getElementById("officeWrap").classList.toggle("d-none", e.target.value !== "office");
    });

    document.getElementById("departmentName").addEventListener("change", (e) => {
      const isOther = e.target.value === "أخرى";
      document.getElementById("otherDepartmentWrap").classList.toggle("d-none", !isOther);
      updateUnitsList(e.target.value);
    });

    document.querySelectorAll('input[name="periodType"]').forEach(radio => {
      radio.addEventListener("change", (e) => {
        const val = e.target.value;
        document.getElementById("monthWrap").classList.toggle("d-none", val !== "شهري");
        document.getElementById("semesterWrap").classList.toggle("d-none", val !== "فصلي");
      });
    });

    document.getElementById("basicDataForm").addEventListener("submit", onSubmit);
  }

  function updateUnitsList(department) {
    const unitSel = document.getElementById("unitName");
    const units = UNITS_BY_DEPARTMENT[department] || [];
    if (units.length === 0) {
      unitSel.innerHTML = `<option value="" disabled selected>لا توجد وحدات مسجلة لهذا القسم</option>`;
      return;
    }
    unitSel.innerHTML = `<option value="" disabled selected>اختاري الوحدة...</option>` +
      units.map(u => `<option value="${u}">${u}</option>`).join("");
  }

  async function hydrateForm() {
    const report = await loadReport(reportId);
    const d = report?.basicData;
    if (!d || Object.keys(d).length === 0) return;

    if (d.entityType) {
      document.getElementById("entityType").value = d.entityType;
      document.getElementById("entityType").dispatchEvent(new Event("change"));
    }
    if (d.departmentName) {
      document.getElementById("departmentName").value = d.departmentName;
      document.getElementById("departmentName").dispatchEvent(new Event("change"));
    }
    if (d.otherDepartmentName) document.getElementById("otherDepartmentName").value = d.otherDepartmentName;
    if (d.officeName) document.getElementById("officeName").value = d.officeName;
    if (d.unitName) {
      setTimeout(() => { document.getElementById("unitName").value = d.unitName; }, 50);
    }
    if (d.periodType) {
      const radio = document.querySelector(`input[name="periodType"][value="${d.periodType}"]`);
      if (radio) { radio.checked = true; radio.dispatchEvent(new Event("change")); }
    }
    if (d.month) document.getElementById("month").value = d.month;
    if (d.semester) document.getElementById("semester").value = d.semester;
    if (d.hijriYear) document.getElementById("hijriYear").value = d.hijriYear;
    if (d.startDate) document.getElementById("startDate").value = d.startDate;
    if (d.endDate) document.getElementById("endDate").value = d.endDate;
    if (d.preparerName) document.getElementById("preparerName").value = d.preparerName;
    if (d.preparerTitle) document.getElementById("preparerTitle").value = d.preparerTitle;
    if (d.directManager) document.getElementById("directManager").value = d.directManager;
  }

  async function onSubmit(e) {
    e.preventDefault();
    const data = {
      mainEntity: document.getElementById("mainEntity").value,
      entityType: document.getElementById("entityType").value,
      departmentName: document.getElementById("departmentName").value,
      otherDepartmentName: document.getElementById("otherDepartmentName").value || "",
      officeName: document.getElementById("officeWrap").classList.contains("d-none") ? "" : document.getElementById("officeName").value,
      unitName: document.getElementById("unitName").value || "",
      periodType: document.querySelector('input[name="periodType"]:checked')?.value || "",
      month: document.getElementById("monthWrap").classList.contains("d-none") ? "" : document.getElementById("month").value,
      semester: document.getElementById("semesterWrap").classList.contains("d-none") ? "" : document.getElementById("semester").value,
      hijriYear: document.getElementById("hijriYear").value,
      startDate: document.getElementById("startDate").value,
      endDate: document.getElementById("endDate").value,
      preparerName: document.getElementById("preparerName").value,
      preparerTitle: document.getElementById("preparerTitle").value,
      directManager: document.getElementById("directManager").value
    };

    try {
      await saveSection(reportId, "basicData", data);
      showSaveToast("تم حفظ البيانات الأساسية بنجاح");
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
