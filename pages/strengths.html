<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقاط القوة | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .card-item { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; background:#fffdf8; box-shadow: var(--shadow-card); }
  .card-item .card-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-item .card-item-head .title { font-weight:700; color: var(--maroon-900); }
  .btn-remove { background:transparent; border:none; color:var(--status-fail); cursor:pointer; font-size:.9rem; }
  .field-label { font-size:.82rem; font-weight:600; margin-bottom:4px; display:block; }
  .form-actions { position: sticky; bottom: 0; background: rgba(250,247,242,0.95); backdrop-filter: blur(4px); padding: 14px 0; margin-top: 10px; }
  .limit-note { font-size:.82rem; color:var(--text-muted); }
  .limit-note.full { color: var(--status-warn); font-weight:700; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:860px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-shield-heart"></i> نقاط القوة</h2>
    <p>حتى خمس نقاط قوة رئيسة فقط — ركّزي على الأبرز.</p>
  </div>

  <div id="strengthsContainer"></div>

  <div class="d-flex align-items-center gap-3 mb-4">
    <button type="button" class="btn-add" id="addStrengthBtn">
      <i class="fa-solid fa-plus"></i> إضافة نقطة قوة
    </button>
    <span class="limit-note" id="limitNote"></span>
  </div>

  <div class="form-actions d-flex justify-content-between">
    <span class="text-muted small" id="lastSaved"></span>
    <button type="button" class="btn-primary" id="saveBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-floppy-disk"></i> حفظ نقاط القوة
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, saveArraySection } from "../js/report-state.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { RepeatableList } from "../js/components/repeatable-list.js";

  let reportId, list;
  const MAX_STRENGTHS = 5;

  const DOMAINS = [
    "القيادة","التخطيط","الكادر","جودة التعليم","البرامج","البيئة","التقنية",
    "التواصل","الشراكات","رضا المستفيدات","سرعة الإنجاز","الابتكار","قياس الأثر","أخرى"
  ];

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    initList();
    const report = await loadReport(reportId);
    list.setItems(report?.strengths || []);
    updateLimitNote();
    document.getElementById("saveBtn").addEventListener("click", onSave);
  });

  function initList() {
    const container = document.getElementById("strengthsContainer");
    list = new RepeatableList({
      container,
      itemLabel: "نقطة قوة",
      maxItems: MAX_STRENGTHS,
      itemFactory: () => ({
        domain: "", otherDomain: "", description: "", evidence: "", impact: "",
        durability: "ongoing", transferable: "yes", maintainHow: ""
      }),
      renderItem: (item, i) => renderCard(item, i),
      onAfterRender: (item, i, card) => bindCard(item, i, card)
    });
    document.getElementById("addStrengthBtn").addEventListener("click", () => {
      list.addItem();
      updateLimitNote();
    });
  }

  function updateLimitNote() {
    const note = document.getElementById("limitNote");
    const count = list.getItems().length;
    note.textContent = `${count} / ${MAX_STRENGTHS}`;
    note.classList.toggle("full", count >= MAX_STRENGTHS);
    document.getElementById("addStrengthBtn").disabled = count >= MAX_STRENGTHS;
    document.getElementById("addStrengthBtn").style.opacity = count >= MAX_STRENGTHS ? "0.5" : "1";
  }

  function renderCard(item, i) {
    return `
    <div class="card-item" data-item-index="${i}">
      <div class="card-item-head">
        <span class="title">نقطة قوة ${i + 1}</span>
        <button type="button" class="btn-remove" data-action="remove-item"><i class="fa-solid fa-trash"></i> حذف</button>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="field-label">مجال نقطة القوة</label>
          <select class="form-control" data-field="domain">
            <option value="">اختاري...</option>
            ${DOMAINS.map(d => `<option ${item.domain===d?"selected":""}>${d}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-6 ${item.domain==="أخرى"?"":"d-none"}" data-other-domain>
          <label class="field-label">حددي المجال</label>
          <input type="text" class="form-control" data-field="otherDomain" value="${escapeAttr(item.otherDomain)}">
        </div>

        <div class="col-12">
          <label class="field-label">وصف نقطة القوة</label>
          <textarea class="form-control" rows="2" data-field="description">${escapeHtml(item.description)}</textarea>
        </div>
        <div class="col-md-6">
          <label class="field-label">الدليل عليها</label>
          <input type="text" class="form-control" data-field="evidence" value="${escapeAttr(item.evidence)}">
        </div>
        <div class="col-md-6">
          <label class="field-label">أثرها</label>
          <input type="text" class="form-control" data-field="impact" value="${escapeAttr(item.impact)}">
        </div>

        <div class="col-md-6">
          <label class="field-label">هل هي مستمرة أم مرتبطة بفترة؟</label>
          <div class="d-flex gap-3 mt-2">
            <div class="form-check">
              <input type="radio" class="form-check-input" name="durability-${i}" data-field="durability" value="ongoing" ${item.durability==="ongoing"?"checked":""}>
              <label class="form-check-label">مستمرة</label>
            </div>
            <div class="form-check">
              <input type="radio" class="form-check-input" name="durability-${i}" data-field="durability" value="periodic" ${item.durability==="periodic"?"checked":""}>
              <label class="form-check-label">مرتبطة بفترة</label>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="field-label">هل يمكن نقلها إلى وحدات أخرى؟</label>
          <div class="d-flex gap-3 mt-2">
            <div class="form-check">
              <input type="radio" class="form-check-input" name="transferable-${i}" data-field="transferable" value="yes" ${item.transferable==="yes"?"checked":""}>
              <label class="form-check-label">نعم</label>
            </div>
            <div class="form-check">
              <input type="radio" class="form-check-input" name="transferable-${i}" data-field="transferable" value="no" ${item.transferable==="no"?"checked":""}>
              <label class="form-check-label">لا</label>
            </div>
          </div>
        </div>

        <div class="col-12">
          <label class="field-label">كيف يمكن المحافظة عليها؟</label>
          <input type="text" class="form-control" data-field="maintainHow" value="${escapeAttr(item.maintainHow)}">
        </div>
      </div>
    </div>`;
  }

  function bindCard(item, i, card) {
    if (!card) return;
    const otherWrap = card.querySelector("[data-other-domain]");
    if (otherWrap) otherWrap.classList.toggle("d-none", item.domain !== "أخرى");
  }

  function escapeAttr(v) {
    if (v === undefined || v === null) return "";
    return String(v).replace(/"/g, "&quot;");
  }
  function escapeHtml(v) {
    if (v === undefined || v === null) return "";
    return String(v).replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function onSave() {
    try {
      await saveArraySection(reportId, "strengths", list.getItems());
      showSaveToast(`تم حفظ ${list.getItems().length} نقطة قوة بنجاح`);
      document.getElementById("lastSaved").textContent = "آخر حفظ: " + new Date().toLocaleString("ar-SA");
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الحفظ، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
