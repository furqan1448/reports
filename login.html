<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="header">
      <div class="logo-circle"><img src="furqan-logo.png" alt="شعار جمعية فرقان"></div>
      <h1>نظام توثيق الأداء</h1>
      <p>جمعية فرقان لتحفيظ القرآن الكريم - الطائف</p>
    </div>
    <div class="body">
      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-icon-group">
            <input type="text" id="email" class="form-control" placeholder="البريد الإلكتروني اللي بشيت المستخدمات" required autocomplete="username">
            <i class="fa-regular fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="input-icon-group">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span id="loginBtnText">تسجيل الدخول</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
    </div>
    <div class="login-footer">
      جميع الحقوق محفوظة &copy; جمعية فرقان لتحفيظ القرآن الكريم
    </div>
  </div>
</div>

<script type="module">
  import { login, redirectByRole } from "./js/auth.js";

  const form = document.getElementById("loginForm");
  const alertBox = document.getElementById("alertBox");
  const btn = document.getElementById("loginBtn");
  const btnText = document.getElementById("loginBtnText");
  const spinner = document.getElementById("loginSpinner");

  function showError(msg) {
    alertBox.textContent = msg;
    alertBox.classList.add("show");
  }

  function setLoading(loading) {
    btn.disabled = loading;
    spinner.classList.toggle("d-none", !loading);
    btnText.textContent = loading ? "جارٍ الدخول..." : "تسجيل الدخول";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.remove("show");
    setLoading(true);

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const profile = await login(email, password);
      redirectByRole(profile);
    } catch (err) {
      console.error(err);
      showError(err.message || "تعذّر تسجيل الدخول. تحققي من البريد الإلكتروني وكلمة المرور.");
      setLoading(false);
    }
  });
</script>
</body>
</html>
