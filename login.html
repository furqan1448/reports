<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="header">
      <div class="logo-circle"><img src="furqan-logo.png" alt="شعار جمعية فرقان"></div>
      <h1>نظام توثيق الأداء</h1>
      <p>جمعية فرقان لتحفيظ القرآن الكريم - الطائف</p>
    </div>
    <div class="body">
      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">الوحدة / اسم المستخدم</label>
          <div class="input-icon-group">
            <select id="username" class="form-control" required autocomplete="username">
              <option value="" disabled selected>جارِ تحميل القائمة...</option>
            </select>
            <i class="fa-solid fa-building-columns"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="input-icon-group">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span id="loginBtnText">تسجيل الدخول</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
    </div>
    <div class="login-footer">
      جميع الحقوق محفوظة &copy; جمعية فرقان لتحفيظ القرآن الكريم
    </div>
  </div>
</div>

<script type="module">
  import { login, redirectByRole } from "./js/auth.js";
  import { callApi } from "./js/api-config.js";

  const alertBox = document.getElementById("alertBox");
  const usernameSelect = document.getElementById("username");
  const loginForm = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const btnText = document.getElementById("loginBtnText");
  const spinner = document.getElementById("loginSpinner");

  function showError(msg) {
    alertBox.textContent = msg;
    alertBox.classList.add("show");
  }

  function setLoading(loading) {
    btn.disabled = loading;
    spinner.classList.toggle("d-none", !loading);
    btnText.textContent = loading ? "جارٍ الدخول..." : "تسجيل الدخول";
  }

  // -------- تعبئة قائمة الدخول المنسدلة --------
  // بنفس فكرة نظام المقاصف بالضبط: قائمة وحدة واحدة (بدون تبويبات "فردي" و"وحدة")
  // تُجلب من شيت "المستخدمات" مباشرة، وتشمل كل أنواع الحسابات (موظفة، مسؤولة
  // وحدة، مديرة، مركز...) بنفس القائمة.
  async function loadLoginOptions(attempt) {
    attempt = attempt || 1;
    btn.disabled = true;
    try {
      const res = await callApi("getLoginOptions", {});
      if (!res.ok) throw new Error(res.error || "تعذّر تحميل القائمة");

      usernameSelect.innerHTML = `<option value="" disabled selected>اختاري الوحدة...</option>` +
        res.users.map(function (u) {
          return `<option value="${u.username}">${u.name}</option>`;
        }).join("");

      btn.disabled = false;
    } catch (err) {
      console.error(err);
      if (attempt < 3) {
        setTimeout(function () { loadLoginOptions(attempt + 1); }, 1500);
      } else {
        usernameSelect.innerHTML = `<option value="" disabled selected>تعذّر تحميل القائمة</option>`;
        showError("تعذّر الاتصال بالنظام. تأكدي من الإنترنت وأعيدي تحميل الصفحة.");
      }
    }
  }
  loadLoginOptions();

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.classList.remove("show");
    setLoading(true);

    const username = usernameSelect.value.trim();
    const password = document.getElementById("password").value;

    try {
      const profile = await login(username, password);
      redirectByRole(profile);
    } catch (err) {
      console.error(err);
      showError(err.message || "تعذّر تسجيل الدخول. تحققي من كلمة المرور.");
      setLoading(false);
    }
  });
</script>
</body>
</html>
